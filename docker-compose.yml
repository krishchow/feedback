# Local Postgres for testing the stores against a real server, not just PGlite:
#   docker compose up -d --wait
#   MCP_FEEDBACK_TEST_POSTGRES_URL=postgres://feedback:feedback@127.0.0.1:54329/feedback pnpm test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback -d feedback"]
      interval: 2s
      timeout: 3s
      retries: 15
