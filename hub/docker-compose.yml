# A hub with Postgres, for a VPS or for trying it locally. Put a TLS-terminating proxy in front of it
# for real use: installations only talk to https (or to localhost).
#
#   cp hub/.env.example hub/.env   # then fill it in
#   docker compose -f hub/docker-compose.yml up -d --build
services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    env_file: .env
    environment:
      MCP_FEEDBACK_POSTGRES_URL: postgres://hub:hub@db:5432/hub
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    volumes:
      - hub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  hub-db:
